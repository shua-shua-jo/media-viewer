[package]
name = "media-viewer"
version = "0.1.0-beta.1"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
open = "5.4.5"
rfd = "0.17.2"
trash = "5.2.9"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
