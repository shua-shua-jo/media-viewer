[package]
name = "media-viewer"
version = "0.1.0-beta.1"
edition = "2024"
description = "Lightweight photo and video viewer with favorites"
license = "MIT"
repository = "https://github.com/shua-shua-jo/media-viewer"
readme = "README.md"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
open = "5.4.5"
rfd = "0.17.2"
trash = "5.2.9"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
