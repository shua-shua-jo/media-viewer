name: Release

# Runs when you push a version tag such as v1.0.0 (or v1.1.0-beta.1 for a pre-release).
on:
  push:
    tags: ['v*']

# Needed to create the GitHub Release and upload files to it.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: media_viewer # must match `name` in Cargo.toml

jobs:
  verify:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$VERSION"
            echo "Update the version in Cargo.toml, commit, and re-tag."
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: '.exe'
            archive: zip
          # Built on an older Ubuntu so the program runs on more Linux distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: ''
            archive: tar.gz
          # Apple Silicon (M1/M2/M3...)
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            ext: ''
            archive: tar.gz
          # Intel Macs (cross-compiled on the Apple Silicon runner)
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            ext: ''
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          NAME="${APP_NAME}-${GITHUB_REF_NAME}-${{ matrix.label }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/${APP_NAME}${{ matrix.ext }}" "$NAME/"
          cp README.md "$NAME/"
          if [ -f LICENSE ]; then cp LICENSE "$NAME/"; fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
          echo "ASSET=$NAME.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Tags with a dash (v1.2.0-beta.1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
