name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # lets GitHub sign build attestations
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$VERSION"
            echo "Update the version in Cargo.toml, commit, and re-tag."
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: '.exe'
            archive: zip
          # Built on an older Ubuntu so the program runs on more Linux distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: ''
            archive: tar.gz
          # Apple Silicon (M1/M2/M3...)
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            ext: ''
            archive: tar.gz
          # Intel Macs (cross-compiled on the Apple Silicon runner)
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
            ext: ''
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          # Read the program name from Cargo.toml so it can never get out of sync.
          APP_NAME=$(grep -m1 '^name' Cargo.toml | sed -E 's/name *= *"([^"]+)"/\1/')
          BIN="target/${{ matrix.target }}/release/${APP_NAME}${{ matrix.ext }}"
          echo "Looking for: $BIN"
          ls -la "target/${{ matrix.target }}/release/" || true
          NAME="${APP_NAME}-${GITHUB_REF_NAME}-${{ matrix.label }}"
          mkdir "$NAME"
          cp "$BIN" "$NAME/"
          cp README.md "$NAME/"
          if [ -f LICENSE ]; then cp LICENSE "$NAME/"; fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
          echo "ASSET=$NAME.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Use this version's section of CHANGELOG.md as the release notes.
      # Pre-release tags (e.g. v1.0.0-rc.1) have no section, so they get a short fallback text.
      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $GITHUB_REF_NAME. See [CHANGELOG.md](CHANGELOG.md) for details." > release-notes.md
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          # Tags with a dash (v1.2.0-beta.1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
