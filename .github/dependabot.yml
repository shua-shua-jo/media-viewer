# Opens pull requests when dependencies or workflow actions have updates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      - dependency-name: 'ffmpeg-next'
      - dependency-name: 'ffmpeg-sys-next'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
